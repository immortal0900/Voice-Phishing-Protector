[project]
name = "september-project"
version = "0.1.0"
description = "Real-time voice phishing detection PoC"
authors = [{ name = "GitHub Copilot" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.39.0",
    "faster-whisper>=1.0.2",
    "ollama>=0.2.1",
    # "torch>=2.3.1",
    # "torchaudio>=2.3.1",
    "librosa>=0.10.2",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "soundfile>=0.12.1",
    "ultralytics>=8.0.0",
    "opencv-python>=4.7.0",
    "requests>=2.32.3",
    "tqdm>=4.66.4",
    "uvicorn>=0.36.0",
    "fastapi>=0.117.1",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
include = ["*.py"]
